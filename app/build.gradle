plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.parcelize)
}

android {
    namespace 'com.mosi.mosc.ai_weather'
    compileSdk 34
    buildToolsVersion "36.1.0"

    defaultConfig {
        applicationId "com.mosi.mosc.ai_weather"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { 
        jvmTarget = "17"
    }

    buildFeatures {
        aidl = true  // ✅ 确保启用 AIDL
    }
}

dependencies {
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.constraintlayout
//    implementation libs.androidx.monitor
    compileOnly fileTree(dir: 'libs', include: ['*.aar', '*.jar'])

    implementation libs.retrofit.gson.converter
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android

    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.junit

    // 云端语音等SDK
    implementation(files("libs/speech-sdk-2.4.0.jar"))
    implementation(files("libs/tts-sdk-2.0.0.jar"))
    implementation(files("libs/vvs-sdk-1.0.0.jar"))

    // car service
    implementation(files("libs/DataCenterSdk-v1.0.jar"))

    // speech-sdk 内部 StringExtKt 依赖 SnakeYAML（本地 jar 不会带传递依赖）
//    implementation libs.snakeyaml
}